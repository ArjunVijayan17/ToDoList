<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="container">
        <h2>Your Todo List</h2>
        <form th:action="@{/todos}" th:object="${todo}" method="post" class="todo-add-form">
            <input type="text" th:field="*{description}" placeholder="What needs to be done?" />
            <button type="submit">Add</button>
        </form>

        <ul>
            <li th:each="todo : ${todos}" th:class="${todo.completed} ? 'completed'">
                <span class="todo-description" th:text="${todo.description}"></span>
                
                <div class="todo-actions">
                    <form th:action="@{/todos/{id}/complete(id=${todo.id})}" method="post">
                        <button type="submit" th:if="${!todo.completed}" class="complete-btn">Complete</button>
                    </form>
                    <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
